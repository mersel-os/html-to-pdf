# ─────────────────────────────────────────────────────────────────────
# Prometheus — HtmlToPdf Servis Scrape Yapılandırması
# ─────────────────────────────────────────────────────────────────────

global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "htmltopdf"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets: ["htmltopdf:8080"]
        labels:
          service: "htmltopdf"
          environment: "production"
