# ─────────────────────────────────────────────────────────────────────
# MERSEL HtmlToPdf — Monitoring Stack
#
# Kullanım:
#   cd monitoring
#   docker compose up -d --build
#
# Erişim Adresleri:
#   HtmlToPdf API : http://localhost:5090
#   Scalar Docs   : http://localhost:5090/scalar/v1
#   Prometheus    : http://localhost:9090
#   Grafana       : http://localhost:3000  (admin / htmltopdf)
# ─────────────────────────────────────────────────────────────────────

services:
  # ── HtmlToPdf Servisi ───────────────────────────────────────────────
  htmltopdf:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "5090:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Serilog__MinimumLevel__Default=Information
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped

  # ── Prometheus ──────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    depends_on:
      htmltopdf:
        condition: service_healthy
    restart: unless-stopped

  # ── Grafana ─────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=htmltopdf
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/htmltopdf.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
