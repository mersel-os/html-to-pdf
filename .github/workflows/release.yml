# ══════════════════════════════════════════════════════════════════════
# Release — Tag push'ta çalışır (v*)
# NuGet paketlerini yayınlar + Docker image push eder
# ══════════════════════════════════════════════════════════════════════
#
# Kullanım:
#   git tag v1.0.0
#   git push origin v1.0.0
#
# Gerekli Repository Secrets:
#   NUGET_API_KEY — nuget.org API anahtarı
#
# GitHub Container Registry (ghcr.io) için GITHUB_TOKEN otomatik sağlanır.
# ══════════════════════════════════════════════════════════════════════

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  # ── 1. Build & Test ────────────────────────────────────────────────
  validate:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: .NET SDK Kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: NuGet Önbellek
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Bağımlılıkları Geri Yükle
        run: dotnet restore

      - name: Derle (Release)
        run: dotnet build --no-restore -c Release

      - name: Playwright Chromium Kur
        shell: pwsh
        run: ./tests/Converter.Tests/bin/Release/net9.0/playwright.ps1 install chromium --with-deps

      - name: Testleri Çalıştır
        run: dotnet test --no-build -c Release --verbosity normal

  # ── 2. NuGet Yayınlama ────────────────────────────────────────────
  nuget-publish:
    name: NuGet Yayınla
    runs-on: ubuntu-latest
    needs: validate
    environment: nuget

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: .NET SDK Kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Tag'den Versiyon Çıkar
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$TAG" >> $GITHUB_OUTPUT
          echo "📦 Versiyon: $TAG"

      - name: Bağımlılıkları Geri Yükle
        run: dotnet restore

      - name: Derle (Release)
        run: dotnet build --no-restore -c Release -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Client Paketini Oluştur
        run: |
          dotnet pack src/Client \
            -c Release \
            --no-build \
            -o ./nupkgs \
            -p:PackageVersion=${{ steps.version.outputs.VERSION }}

      - name: Oluşturulan Paketler
        run: ls -la ./nupkgs/

      - name: NuGet.org'a Yayınla
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: NuGet Paketlerini Artifact Olarak Sakla
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs-${{ steps.version.outputs.VERSION }}
          path: ./nupkgs/*.nupkg
          retention-days: 90

  # ── 3. Docker Image Yayınlama ──────────────────────────────────────
  docker-publish:
    name: Docker Image Yayınla
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Buildx Kur
        uses: docker/setup-buildx-action@v3

      - name: GitHub Container Registry'ye Giriş Yap
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Metadata (tag, label)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Docker Image Derle ve Push Et
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # ── 4. GitHub Release Oluştur ──────────────────────────────────────
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [nuget-publish, docker-publish]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag'den Versiyon Çıkar
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: NuGet Paketlerini İndir
        uses: actions/download-artifact@v4
        with:
          name: nupkgs-${{ steps.version.outputs.VERSION }}
          path: ./nupkgs

      - name: GitHub Release Oluştur
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: ./nupkgs/*.nupkg
          body: |
            ## 📦 NuGet Paketleri

            ```bash
            dotnet add package MERSEL.Services.HtmlToPdf.Client --version ${{ steps.version.outputs.VERSION }}
            ```

            | Paket | Versiyon |
            |-------|----------|
            | [MERSEL.Services.HtmlToPdf.Client](https://www.nuget.org/packages/MERSEL.Services.HtmlToPdf.Client/${{ steps.version.outputs.VERSION }}) | ${{ steps.version.outputs.VERSION }} |

            ## 🐳 Docker Image

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
            ```
