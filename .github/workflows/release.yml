# ══════════════════════════════════════════════════════════════════════
# Release — Tag push'ta çalışır (v*)
# NuGet paketlerini yayınlar + Docker image push eder + platform paketleri üretir
# ══════════════════════════════════════════════════════════════════════
#
# Kullanım:
#   git tag v1.0.0
#   git push origin v1.0.0
#
# Gerekli Repository Secrets:
#   NUGET_API_KEY — nuget.org API anahtarı
#
# GitHub Container Registry (ghcr.io) için GITHUB_TOKEN otomatik sağlanır.
# ══════════════════════════════════════════════════════════════════════

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  # ── 1. Build & Test ────────────────────────────────────────────────
  validate:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: .NET SDK Kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: NuGet Önbellek
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Bağımlılıkları Geri Yükle
        run: dotnet restore

      - name: Derle (Release)
        run: dotnet build --no-restore -c Release

      - name: Playwright Chromium Kur
        shell: pwsh
        run: ./tests/Converter.Tests/bin/Release/net9.0/playwright.ps1 install chromium --with-deps

      - name: Testleri Çalıştır
        run: dotnet test --no-build -c Release --verbosity normal

  # ── 2. NuGet Yayınlama ────────────────────────────────────────────
  nuget-publish:
    name: NuGet Yayınla
    runs-on: ubuntu-latest
    needs: validate
    environment: nuget

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: .NET SDK Kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Tag'den Versiyon Çıkar
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$TAG" >> "$GITHUB_OUTPUT"
          echo "📦 Versiyon: $TAG"

      - name: Bağımlılıkları Geri Yükle
        run: dotnet restore

      - name: Derle (Release)
        run: dotnet build --no-restore -c Release -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Client Paketini Oluştur
        run: |
          dotnet pack src/Client \
            -c Release \
            --no-build \
            -o ./nupkgs \
            -p:PackageVersion=${{ steps.version.outputs.VERSION }}

      - name: Oluşturulan Paketler
        run: ls -la ./nupkgs/

      - name: NuGet.org'a Yayınla
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: NuGet Paketlerini Artifact Olarak Sakla
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs-${{ steps.version.outputs.VERSION }}
          path: ./nupkgs/*.nupkg
          retention-days: 90

  # ── 3. Docker Image Yayınlama ──────────────────────────────────────
  docker-publish:
    name: Docker Image Yayınla
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Buildx Kur
        uses: docker/setup-buildx-action@v3

      - name: GitHub Container Registry'ye Giriş Yap
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Metadata (tag, label)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Docker Image Derle ve Push Et
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # ── 4. Platform Paketleri ──────────────────────────────────────────
  platform-publish:
    name: Platform Paketi (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    needs: validate
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            archive: zip
          - os: windows-latest
            rid: win-x86
            archive: zip
          - os: macos-15-intel
            rid: osx-x64
            archive: tar.gz
          - os: macos-14
            rid: osx-arm64
            archive: tar.gz
          - os: ubuntu-latest
            rid: linux-x64
            archive: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: .NET SDK Kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: NuGet Önbellek
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ matrix.rid }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ matrix.rid }}-
            nuget-${{ runner.os }}-

      - name: Tag'den Versiyon Çıkar
        id: version
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$TAG" >> "$GITHUB_OUTPUT"
          echo "ASSET_NAME=MERSEL.Services.HtmlToPdf.Web-$TAG-${{ matrix.rid }}" >> "$GITHUB_OUTPUT"

      - name: Bağımlılıkları Geri Yükle
        run: dotnet restore src/Web/Web.csproj -r ${{ matrix.rid }}

      - name: Web Servisini Yayınla
        run: >
          dotnet publish src/Web/Web.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          --no-restore
          -o ./publish/${{ matrix.rid }}
          -p:Version=${{ steps.version.outputs.VERSION }}
          -p:PublishSingleFile=true

      - name: Playwright Chromium'u Paketle
        shell: pwsh
        run: |
          $publishDir = Resolve-Path "./publish/${{ matrix.rid }}"
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $publishDir "ms-playwright"

          $script = Get-ChildItem -Path . -Filter "playwright.ps1" -Recurse |
            Where-Object { $_.FullName -like "*src*Web*bin*Release*" } |
            Select-Object -First 1

          if (-not $script) {
            throw "playwright.ps1 bulunamadı."
          }

          & $script.FullName install chromium

      - name: Paket Manifesti Yaz
        shell: pwsh
        run: |
          $publishDir = Resolve-Path "./publish/${{ matrix.rid }}"
          $manifest = [ordered]@{
            name = "MERSEL.Services.HtmlToPdf.Web"
            version = "${{ steps.version.outputs.VERSION }}"
            rid = "${{ matrix.rid }}"
            selfContained = $true
            executable = if ("${{ runner.os }}" -eq "Windows") { "Web.exe" } else { "Web" }
            environment = @{
              ASPNETCORE_URLS = "http://127.0.0.1:8080"
              PLAYWRIGHT_BROWSERS_PATH = "ms-playwright"
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path (Join-Path $publishDir "html-to-pdf.manifest.json") -Encoding UTF8

      - name: Başlatıcı Betik Yaz
        shell: pwsh
        run: |
          $publishDir = Resolve-Path "./publish/${{ matrix.rid }}"

          if ("${{ runner.os }}" -eq "Windows") {
            $scriptPath = Join-Path $publishDir "run-html-to-pdf.cmd"
            @(
              '@echo off'
              'set "SCRIPT_DIR=%~dp0"'
              'if "%ASPNETCORE_URLS%"=="" set "ASPNETCORE_URLS=http://127.0.0.1:8080"'
              'set "PLAYWRIGHT_BROWSERS_PATH=%SCRIPT_DIR%ms-playwright"'
              '"%SCRIPT_DIR%Web.exe" %*'
            ) | Set-Content -Path $scriptPath -Encoding ASCII
          } else {
            $scriptPath = Join-Path $publishDir "run-html-to-pdf"
            @(
              '#!/usr/bin/env bash'
              'set -euo pipefail'
              ''
              'SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"'
              'export ASPNETCORE_URLS="${ASPNETCORE_URLS:-http://127.0.0.1:8080}"'
              'export PLAYWRIGHT_BROWSERS_PATH="${PLAYWRIGHT_BROWSERS_PATH:-$SCRIPT_DIR/ms-playwright}"'
              ''
              'exec "$SCRIPT_DIR/Web" "$@"'
            ) | Set-Content -Path $scriptPath -Encoding UTF8
            chmod +x $scriptPath
          }

      - name: Arşiv Oluştur (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./dist | Out-Null
          Compress-Archive `
            -Path "./publish/${{ matrix.rid }}/*" `
            -DestinationPath "./dist/${{ steps.version.outputs.ASSET_NAME }}.zip" `
            -Force

      - name: Arşiv Oluştur (macOS/Linux)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p ./dist
          tar -czf "./dist/${{ steps.version.outputs.ASSET_NAME }}.tar.gz" -C "./publish/${{ matrix.rid }}" .

      - name: Platform Paketini Artifact Olarak Sakla
        uses: actions/upload-artifact@v4
        with:
          name: platform-${{ matrix.rid }}
          path: ./dist/*
          if-no-files-found: error
          retention-days: 90

  # ── 5. GitHub Release Oluştur ──────────────────────────────────────
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [nuget-publish, docker-publish, platform-publish]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag'den Versiyon Çıkar
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: NuGet Paketlerini İndir
        uses: actions/download-artifact@v4
        with:
          name: nupkgs-${{ steps.version.outputs.VERSION }}
          path: ./nupkgs

      - name: Platform Paketlerini İndir
        uses: actions/download-artifact@v4
        with:
          pattern: platform-*
          path: ./platform-packages
          merge-multiple: true

      - name: GitHub Release Oluştur
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            ./nupkgs/*.nupkg
            ./platform-packages/*
          body: |
            ## 📦 NuGet Paketleri

            ```bash
            dotnet add package MERSEL.Services.HtmlToPdf.Client --version ${{ steps.version.outputs.VERSION }}
            ```

            | Paket | Versiyon |
            |-------|----------|
            | [MERSEL.Services.HtmlToPdf.Client](https://www.nuget.org/packages/MERSEL.Services.HtmlToPdf.Client/${{ steps.version.outputs.VERSION }}) | ${{ steps.version.outputs.VERSION }} |

            ## 🐳 Docker Image

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
            ```

            ## 🖥️ Platform Paketleri

            Self-contained Web servis paketleri release asset'i olarak eklenir:

            - `MERSEL.Services.HtmlToPdf.Web-${{ steps.version.outputs.VERSION }}-win-x64.zip`
            - `MERSEL.Services.HtmlToPdf.Web-${{ steps.version.outputs.VERSION }}-win-x86.zip`
            - `MERSEL.Services.HtmlToPdf.Web-${{ steps.version.outputs.VERSION }}-osx-x64.tar.gz`
            - `MERSEL.Services.HtmlToPdf.Web-${{ steps.version.outputs.VERSION }}-osx-arm64.tar.gz`
            - `MERSEL.Services.HtmlToPdf.Web-${{ steps.version.outputs.VERSION }}-linux-x64.tar.gz`

            Paketlerde Playwright Chromium `ms-playwright/` altında gelir. Manuel çalıştırma için `run-html-to-pdf` veya `run-html-to-pdf.cmd` başlatıcısını kullanın.
